location ^~ /services/assets/ {
    alias /workspace/laravel/public/services/assets/;
    add_header X-Content-Type-Options nosniff always;
    expires 1h;
    location ~ /\. { deny all; }
    location ~ \.(php|phtml|phar)$ { deny all; }
}
location = /services {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /workspace/laravel/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /workspace/laravel/public;
    fastcgi_pass laravel_services_backend;
}
location ^~ /services/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /workspace/laravel/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /workspace/laravel/public;
    fastcgi_pass laravel_services_backend;
}
